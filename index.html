<script src="https://cdn.jsdelivr.net/npm/bcryptjs@3.0.3/umd/index.js"></script>
<style>
  :root{
    --navy:#132242;
    --navy-deep:#0A1428;
    --blue:#2F5DA8;
    --blue-soft:#DCE6F5;
    --gold:#C9A227;
    --gold-soft:#F3E6BE;
    --gold-bright:#E7BB3C;
    --paper:#EEF1F6;
    --card:#FFFFFF;
    --ink:#171C28;
    --ink-soft:#565F73;
    --line:#DCE1EA;
    --red-live:#C1272D;
    --green-ok:#2E7D4F;
    --shadow-sm:0 2px 6px rgba(15,26,54,.06);
    --shadow-md:0 10px 24px rgba(15,26,54,.10);
    --shadow-lg:0 20px 44px rgba(15,26,54,.16);
    --ease:cubic-bezier(.22,.9,.32,1);
    --heading:var(--navy-deep);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;font-weight:600;margin:0;color:var(--heading);}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  img{max-width:100%;}

  /* ---------- TICKER ---------- */
  .ticker-bar{background:var(--navy-deep);color:#fff;overflow:hidden;white-space:nowrap;display:flex;align-items:center;height:38px;position:relative;z-index:30;}
  .ticker-label{flex:0 0 auto;background:linear-gradient(135deg,var(--red-live),#8f1b20);color:#fff;font-weight:700;font-size:11px;letter-spacing:.06em;padding:0 14px;height:100%;display:flex;align-items:center;gap:7px;}
  .live-dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.8);}}
  .ticker-track-wrap{flex:1 1 auto;overflow:hidden;position:relative;height:100%;min-width:0;
    mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);}
  .ticker-track{display:flex;align-items:center;gap:44px;position:absolute;white-space:nowrap;animation:scroll-left 40s linear infinite;height:100%;padding-left:100%;}
  .ticker-track span{font-size:12.5px;font-weight:500;opacity:.95;}
  .ticker-track span b{color:var(--gold-bright);font-weight:700;}
  @keyframes scroll-left{from{transform:translateX(0);}to{transform:translateX(-100%);}}
  @media (prefers-reduced-motion: reduce){.ticker-track{animation:none;padding-left:16px;}.live-dot{animation:none;}}

  /* ---------- HEADER / NAV ---------- */
  header.site{
    background:linear-gradient(120deg,var(--navy) 0%,#182b52 100%);
    color:#fff;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;
    gap:16px;position:sticky;top:0;z-index:40;box-shadow:0 4px 18px rgba(10,20,40,.18);
  }
  .brand{display:flex;align-items:center;gap:10px;line-height:1.2;min-width:0;}
  .brand .logo-dot{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--gold-bright),var(--gold));display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;color:var(--navy-deep);font-size:15px;flex:0 0 auto;box-shadow:var(--shadow-sm);}
  .brand .txt{display:flex;flex-direction:column;min-width:0;}
  .brand .mark{font-family:'Fraunces',serif;font-weight:700;font-size:18px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand .sub{font-size:11px;color:var(--gold-soft);opacity:.85;}

  nav.site-nav{display:flex;gap:6px;flex-wrap:wrap;}
  nav.site-nav button{
    position:relative;background:transparent;border:1px solid rgba(255,255,255,.16);color:#EDEFF4;
    padding:8px 15px;font-size:13.5px;font-weight:500;border-radius:999px;
    transition:background .2s var(--ease), border-color .2s var(--ease), transform .15s var(--ease);white-space:nowrap;
  }
  nav.site-nav button:hover{background:rgba(255,255,255,.09);transform:translateY(-1px);}
  nav.site-nav button:active{transform:translateY(0) scale(.97);}
  nav.site-nav button.active{background:linear-gradient(135deg,var(--gold-bright),var(--gold));border-color:transparent;color:var(--navy-deep);font-weight:700;box-shadow:var(--shadow-sm);}

  .menu-toggle{display:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;width:38px;height:38px;border-radius:9px;font-size:18px;flex:0 0 auto;transition:background .15s;}
  .menu-toggle:hover{background:rgba(255,255,255,.16);}

  @media (max-width:720px){
    nav.site-nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--navy-deep);flex-direction:column;padding:10px 16px 16px;gap:8px;box-shadow:0 12px 24px rgba(0,0,0,.25);z-index:20;
      animation:drop-in .22s var(--ease);}
    nav.site-nav.open{display:flex;}
    nav.site-nav button{width:100%;text-align:left;padding:12px 14px;}
    .menu-toggle{display:block;}
  }
  @keyframes drop-in{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}

  main{max-width:1100px;margin:0 auto;padding:0 20px 80px;}
  @media (min-width:760px){main{padding:0 32px 90px;}}

  /* ---------- REVEAL ANIMATION ---------- */
  .reveal{opacity:0;transform:translateY(18px);transition:opacity .6s var(--ease), transform .6s var(--ease);}
  .reveal.in-view{opacity:1;transform:translateY(0);}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;overflow:hidden;
    margin:24px 0 0;padding:52px 32px;border-radius:20px;
    background:radial-gradient(circle at 85% 12%,#1c3564 0%,var(--navy) 46%,var(--navy-deep) 100%);
    display:grid;grid-template-columns:1fr;gap:30px;color:#fff;
    box-shadow:var(--shadow-lg);
  }
  .hero::before{
    content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.14) 1.4px, transparent 1.4px);
    background-size:22px 22px;mask-image:linear-gradient(120deg,#000,transparent 70%);
    -webkit-mask-image:linear-gradient(120deg,#000,transparent 70%);
  }
  .hero-inner{position:relative;z-index:1;display:grid;grid-template-columns:1fr;gap:30px;}
  @media (min-width:820px){.hero{padding:64px 48px;}.hero-inner{grid-template-columns:1.3fr 1fr;align-items:end;}}
  .hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-bright);margin-bottom:14px;}
  .hero-eyebrow::before{content:"";width:18px;height:2px;background:var(--gold-bright);border-radius:2px;}
  .hero h1{font-size:clamp(30px,5.4vw,48px);line-height:1.08;max-width:16ch;color:#fff;}
  .hero p{color:#C7D0E6;font-size:15.5px;max-width:44ch;margin-top:14px;}
  .hero-stats{display:flex;flex-wrap:wrap;gap:16px;}
  @media (min-width:820px){.hero-stats{flex-direction:column;gap:14px;}.stat{flex:0 0 auto;}}
  .stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:14px 18px;backdrop-filter:blur(2px);flex:1 1 130px;transition:transform .25s var(--ease), background .25s;}
  .stat:hover{transform:translateY(-2px);background:rgba(255,255,255,.1);}
  .stat .num{font-family:'Fraunces',serif;font-size:28px;font-weight:700;color:var(--gold-bright);display:block;}
  .stat .label{font-size:12px;color:#B9C3DC;}

  /* ---------- SECTION TITLES ---------- */
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:52px 0 20px;gap:12px;flex-wrap:wrap;}
  .section-head h2{font-size:24px;}
  .section-head .see-all{font-size:13.5px;font-weight:600;color:var(--blue);padding-bottom:1px;white-space:nowrap;position:relative;}
  .section-head .see-all::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--blue);transform:scaleX(1);transform-origin:right;transition:transform .25s var(--ease);}
  .section-head .see-all:hover::after{transform-origin:left;}

  /* ---------- SUBJECT GRID (cards) ---------- */
  .subject-grid{display:grid;grid-template-columns:1fr;gap:14px;}
  @media (min-width:620px){.subject-grid{grid-template-columns:1fr 1fr;}}
  @media (min-width:980px){.subject-grid{grid-template-columns:1fr 1fr 1fr;}}

  .subject-card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;
    display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;
    box-shadow:var(--shadow-sm);cursor:pointer;
    transition:transform .28s var(--ease), box-shadow .28s var(--ease), border-color .28s var(--ease);
    position:relative;overflow:hidden;
  }
  .subject-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:var(--accent, var(--gold));transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease);
  }
  .subject-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-md);border-color:transparent;}
  .subject-card:hover::before{transform:scaleX(1);}
  .subject-card:active{transform:translateY(-2px) scale(.99);}
  .subj-top{display:flex;align-items:center;gap:12px;}
  .subj-icon{
    width:46px;height:46px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:21px;background:var(--accent-soft, var(--gold-soft));transition:transform .3s var(--ease);
  }
  .subject-card:hover .subj-icon{transform:rotate(-6deg) scale(1.06);}
  .subj-code{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--accent, var(--blue));text-transform:uppercase;}
  .subj-name{font-size:15.5px;font-weight:700;color:var(--heading);margin-top:2px;line-height:1.25;}
  .subject-card .desc{font-size:13px;color:var(--ink-soft);line-height:1.45;flex:1;}
  .subj-meta{display:flex;gap:14px;font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:12px;margin-top:2px;}
  .subj-meta span{display:flex;align-items:center;gap:5px;}
  .subj-schedule{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .subj-schedule b{color:var(--heading);font-weight:700;}
  .schedule-bar{
    display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
    border-radius:12px;padding:12px 16px;margin-top:14px;width:100%;
  }
  .schedule-bar .sch-item{display:flex;align-items:center;gap:6px;font-size:13px;color:#E4E9F5;}
  .schedule-bar .sch-item b{color:#fff;font-weight:700;}
  .schedule-bar .sch-label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-bright);min-width:44px;}
  .countdown-card{
    margin:28px 0 0;border-radius:20px;padding:28px 32px;color:#fff;position:relative;overflow:hidden;
    background:linear-gradient(120deg,#182b52 0%,var(--navy-deep) 100%);box-shadow:var(--shadow-md);
    display:grid;grid-template-columns:1fr;gap:22px;align-items:center;
  }
  .countdown-card::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(231,187,60,.22),transparent 70%);pointer-events:none;}
  @media (min-width:820px){.countdown-card{grid-template-columns:1fr auto;}}
  .cd-eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-bright);}
  .cd-title{font-family:'Fraunces',serif;font-size:24px;font-weight:700;color:#fff;margin:4px 0 6px;}
  .cd-dates{font-size:13.5px;color:#C7D0E6;}
  .cd-status{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;background:rgba(231,187,60,.16);color:var(--gold-bright);}
  .cd-units{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative;z-index:1;}
  .cd-unit{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 6px;text-align:center;min-width:68px;}
  .cd-num{display:block;font-family:'Fraunces',serif;font-size:30px;font-weight:700;color:var(--gold-bright);line-height:1.1;font-variant-numeric:tabular-nums;}
  .cd-lbl{font-size:11px;color:#B9C3DC;text-transform:uppercase;letter-spacing:.05em;}
  .cd-done{font-size:15px;color:#C7D0E6;position:relative;z-index:1;}
  @media (max-width:420px){.countdown-card{padding:22px 18px;}.cd-num{font-size:24px;}.cd-unit{min-width:0;}}
  .cd-mini{background:linear-gradient(90deg,#0A1428,#182b52);color:#E4E9F5;text-align:center;font-size:13px;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.08);line-height:1.4;}
  .cd-mini b{color:var(--gold-bright);font-weight:700;font-variant-numeric:tabular-nums;}
  .cd-mini .cd-mini-title{font-weight:600;color:#fff;}
  @media (max-width:420px){.cd-mini{font-size:12px;padding:8px 10px;}}
  .pomo-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;margin-top:8px;}
  .pomo-wrap > *{min-width:0;}
  @media (min-width:900px){.pomo-wrap{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:start;}}
  @media (max-width:420px){.pomo-card{padding:22px 14px;}.pomo-side .form-card{padding:18px 14px;}}
  .pomo-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 22px;box-shadow:var(--shadow-md);text-align:center;--pc:var(--blue);}
  .pomo-card.short{--pc:#1E7F72;}
  .pomo-card.long{--pc:#6B4FA0;}
  .pomo-modes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:22px;}
  .pomo-mode{padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--ink-soft);transition:all .2s var(--ease);}
  .pomo-mode.active{background:var(--pc);border-color:var(--pc);color:#fff;}
  .pomo-ring{position:relative;width:min(260px,70vw);aspect-ratio:1;margin:0 auto 18px;}
  .pomo-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
  .pomo-ring .track{fill:none;stroke:var(--line);stroke-width:10;}
  .pomo-ring .prog{fill:none;stroke:var(--pc);stroke-width:10;stroke-linecap:round;stroke-dasharray:628.32;stroke-dashoffset:0;transition:stroke-dashoffset .4s linear, stroke .3s;}
  .pomo-time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .pomo-time .t{font-family:'Fraunces',serif;font-size:clamp(40px,12vw,56px);font-weight:700;color:var(--heading);font-variant-numeric:tabular-nums;line-height:1;}
  .pomo-time .l{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pc);margin-top:8px;}
  .pomo-controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:18px;}
  .pomo-controls .btn-primary{background:var(--pc);min-width:120px;font-size:15px;padding:12px 26px;}
  .pomo-dots{display:flex;gap:8px;justify-content:center;margin-bottom:6px;}
  .pomo-dots i{width:12px;height:12px;border-radius:50%;background:var(--line);transition:background .3s;}
  .pomo-dots i.on{background:var(--gold);}
  .pomo-stats{font-size:13px;color:var(--ink-soft);}
  .pomo-side .form-card{margin-bottom:18px;text-align:left;}
  .pomo-steps{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-soft);display:flex;flex-direction:column;gap:8px;}
  .pomo-steps b{color:var(--heading);}
  .pomo-study{font-size:13px;color:var(--ink-soft);margin-bottom:16px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .pomo-study select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;max-width:100%;}
  .pomo-res-h{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 8px;}
  .pomo-res-empty{font-size:13px;color:var(--ink-soft);margin:0;}
  .pomo-res-link{display:inline-block;margin-top:6px;font-size:13px;font-weight:600;color:var(--blue);background:none;border:none;padding:0;}
  #pomoResources .resource-item{padding:10px 12px;}
  .chat-log{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 8px;margin-bottom:10px;}
  .chat-msg{max-width:92%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.5;word-wrap:break-word;}
  .chat-msg.user{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px;}
  .chat-msg.bot{align-self:flex-start;background:var(--paper);color:var(--ink);border-bottom-left-radius:4px;}
  .chat-msg.bot.err{background:#FBE2E2;color:#8f1b20;}
  .chat-msg.bot b{color:var(--heading);}
  .chat-intro{font-size:13px;color:var(--ink-soft);margin:0 0 10px;}
  .chat-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .chat-chip{font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--blue);transition:background .2s;}
  .chat-chip:hover{background:var(--blue-soft);}
  .chat-form{display:flex;gap:8px;}
  .chat-form input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;}
  .chat-form input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);outline:none;}
  .chat-form .btn-primary{padding:10px 18px;}
  .chat-form .btn-primary:disabled,.chat-form input:disabled{opacity:.6;cursor:not-allowed;}
  .chat-note{font-size:11.5px;color:var(--ink-soft);margin:10px 0 0;line-height:1.4;}
  .search-btn{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#E4E9F5;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:500;transition:background .2s;flex:0 0 auto;}
  .search-btn:hover{background:rgba(255,255,255,.16);}
  .search-btn kbd{font-family:inherit;font-size:11px;bac
